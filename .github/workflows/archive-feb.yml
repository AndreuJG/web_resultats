name: Arxiu permanent FEB i LF Endesa

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-feb.yml'
      - 'scripts/archive-feb.js'
      - 'lib/feb-archive.js'
      - 'lib/feb.js'

concurrency:
  group: archive-feb
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - id: tercera
        run: npm run archive:feb
        continue-on-error: true
      - id: lf
        run: npm run archive:lf
        continue-on-error: true
      - name: Guardar només les jornades noves o pendents
        if: steps.tercera.outcome == 'success' || steps.lf.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tercera-feb.json data/lf-endesa.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update pending FEB fixtures and archive completed rounds"
          git push origin HEAD:main
      - name: Indicar si alguna font no ha respost
        if: steps.tercera.outcome == 'failure' || steps.lf.outcome == 'failure'
        run: exit 1
